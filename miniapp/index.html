<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120e">
  <title>NEWCAFE — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#17120e; --card:#251d17; --accent:#d8a56d; --muted:#c7b9aa; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px 16px calc(24px + env(safe-area-inset-bottom)); background:var(--bg); color:#fff8f0; font:16px/1.45 system-ui,sans-serif; }
    main { max-width:560px; margin:0 auto; }
    header { padding:18px 4px 24px; }
    h1 { margin:0 0 6px; color:var(--accent); font-size:28px; }
    header p, .hint { margin:0; color:var(--muted); }
    .product { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:10px 0; padding:16px; border:1px solid #493729; border-radius:16px; background:var(--card); }
    .product h2 { margin:0 0 4px; font-size:17px; }
    .product p { margin:0; color:var(--muted); font-size:14px; }
    .price { margin-top:7px; color:var(--accent); font-weight:700; }
    .controls { display:flex; align-items:center; gap:10px; white-space:nowrap; }
    button { border:0; border-radius:12px; padding:11px 14px; background:var(--accent); color:#1b130d; font-weight:700; font-size:16px; cursor:pointer; }
    .controls button { width:42px; padding:8px; }
    #summary { margin:18px 0 12px; padding:16px; border-radius:14px; background:var(--card); }
    #summary p { margin:4px 0; color:var(--muted); }
    #total { color:#fff8f0 !important; font-weight:700; }
    #send { width:100%; min-height:50px; }
    #status { min-height:24px; margin-top:10px; color:var(--accent); text-align:center; }
    .hint { margin-top:12px; text-align:center; font-size:13px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>☕ NEWCAFE</h1>
      <p>Yangi ta'm. Yangi energiya.</p>
    </header>
    <section id="products" aria-label="Mahsulotlar"></section>
    <section id="summary" aria-live="polite"></section>
    <button id="send" type="button">Demo buyurtmani botga yuborish</button>
    <div id="status" role="status"></div>
    <p class="hint">Namoyish loyihasi: to'lov va yetkazib berish yo'q.</p>
  </main>
  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      tg?.ready();
      tg?.expand();
      const products = [
        { id: 'classic', name: 'NEWCAFE Classic', description: 'Klassik eruvchan qahva.', price: 25000, emoji: '☕' },
        { id: 'gold', name: 'NEWCAFE Gold', description: 'Yumshoq ta\'mli premium qahva.', price: 35000, emoji: '✨' },
        { id: 'latte', name: 'NEWCAFE Latte', description: 'Sutli qahva ichimligi.', price: 18000, emoji: '🥛' },
      ];
      const cart = Object.fromEntries(products.map(product => [product.id, 0]));
      const formatMoney = amount => new Intl.NumberFormat('uz-UZ').format(amount) + " so'm";
      const productRoot = document.getElementById('products');
      const summary = document.getElementById('summary');
      const status = document.getElementById('status');

      function render() {
        productRoot.innerHTML = products.map(product => `
          <article class="product">
            <div><h2>${product.emoji} ${product.name}</h2><p>${product.description}</p><div class="price">${formatMoney(product.price)}</div></div>
            <div class="controls">
              <button type="button" aria-label="Kamaytirish ${product.name}" data-action="minus" data-id="${product.id}">−</button>
              <span>${cart[product.id]}</span>
              <button type="button" aria-label="Qo'shish ${product.name}" data-action="plus" data-id="${product.id}">+</button>
            </div>
          </article>`).join('');
        const selected = products.filter(product => cart[product.id] > 0);
        const total = selected.reduce((sum, product) => sum + product.price * cart[product.id], 0);
        summary.innerHTML = selected.length
          ? `${selected.map(product => `<p>${product.name} × ${cart[product.id]}</p>`).join('')}<p id="total">Jami: ${formatMoney(total)}</p>`
          : '<p>Savatcha bo\'sh. Mahsulot miqdorini tanlang.</p>';
        document.getElementById('send').disabled = selected.length === 0;
        document.getElementById('send').style.opacity = selected.length ? '1' : '.55';
      }

      productRoot.addEventListener('click', event => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const id = button.dataset.id;
        cart[id] = Math.max(0, Math.min(99, cart[id] + (button.dataset.action === 'plus' ? 1 : -1)));
        status.textContent = '';
        render();
      });

      document.getElementById('send').addEventListener('click', () => {
        const items = products.filter(product => cart[product.id] > 0)
          .map(product => ({ id: product.id, qty: cart[product.id] }));
        if (!items.length) return;
        if (!tg || typeof tg.sendData !== 'function') {
          status.textContent = 'Mini App Telegram ichidan ochilmagan. Botdagi Mini App tugmasidan qayta oching.';
          return;
        }
        tg.sendData(JSON.stringify({ type: 'demo_order', items }));
        status.textContent = 'Buyurtma botga yuborildi.';
      });
      render();
    })();
  </script>
</body>
</html>
